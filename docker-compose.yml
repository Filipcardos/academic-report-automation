version: "3.9"

services:

  # ── SQL Server (desenvolvimento local) ──────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: academic_sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${SA_PASSWORD:-Afya@2024}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./data/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${SA_PASSWORD:-Afya@2024}" -Q "SELECT 1" -No
      interval: 10s
      timeout: 5s
      retries: 10

  # ── App ─────────────────────────────────────────────────────────────────────
  app:
    build: .
    container_name: academic_report
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      DB_SERVER: "sqlserver"
      DB_NAME:   "${DB_NAME:-AcademicDB}"
      DB_USER:   "sa"
      DB_PASSWORD: "${SA_PASSWORD:-Afya@2024}"
      USE_SEED:  "${USE_SEED:-false}"
      OUTPUT_DIR: /app/reports
    volumes:
      - ./reports:/app/reports
    restart: "no"

volumes:
  sqlserver_data:
